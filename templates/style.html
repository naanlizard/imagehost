{{define "style"}}<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#15161a;color:#e9e7e1;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
main{max-width:1280px;margin:0 auto;padding:56px 70px;display:flex;flex-direction:column;gap:32px}
h1{margin:0;font-size:30px;line-height:1.2;font-weight:650}
h2{margin:0;font-size:22px;font-weight:650}
a{color:inherit}
label{font-size:14px;font-weight:600}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex-grow:1}
.field{display:flex;flex-direction:column;gap:8px}
.panel{padding:24px 28px;background:#1c1e24;border:1px solid #30323a;border-radius:6px}
.hint,.muted{color:#a2a5ad}
.hint{font-size:13px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap;margin:0}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.bar{padding-top:24px;border-top:1px solid #30323a}
.offscreen{position:absolute;left:-9999px}
.check{display:flex;gap:8px;align-items:center;font-weight:400;min-height:44px}

input[type=text],textarea{width:100%;min-height:44px;padding:10px 14px;background:#15161a;color:#e9e7e1;border:1px solid #3a3d47;border-radius:4px;font:inherit;font-size:16px}
input.narrow{max-width:640px}
textarea{min-height:88px;line-height:1.5;resize:vertical}
input[type=file]{width:100%;padding:48px 20px;border:1px dashed #4a4e5a;border-radius:6px;color:#a2a5ad;font:inherit;cursor:pointer}

button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;background:transparent;color:#e9e7e1;border:1px solid #3a3d47;border-radius:4px;font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.primary{background:#8fb4ff;color:#10131a;border-color:#8fb4ff;font-size:15px;font-weight:600;padding:0 22px}
.danger{color:#ff9a8f;border-color:#6b3a36}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.card{display:flex;flex-direction:column;gap:12px}
.card .preview{display:block;height:200px;background:#262830;border-radius:4px;overflow:hidden}
.preview picture{display:contents}
.card .preview img,.card .preview video{width:100%;height:100%;object-fit:cover;display:block}
.title{font-weight:600;overflow-wrap:anywhere}

.item{display:flex;gap:24px;padding:20px}
.item .preview{width:280px;flex-shrink:0}
.item .preview img,.item .preview video{display:block;width:100%;max-height:280px;object-fit:contain;background:#262830;border-radius:4px}

@media (max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){
main{padding:28px 16px;gap:24px}
h1{font-size:26px}
.panel{padding:20px 16px}
.cards{grid-template-columns:minmax(0,1fr)}
.item{flex-direction:column}
.item .preview{width:100%}
}
</style>{{end}}
