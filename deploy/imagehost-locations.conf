# Include inside a server block. /data is the app's data folder, mounted read-only.

server_tokens off;
client_max_body_size 100m;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Robots-Tag "noindex" always;

location ~ "^/a/([0-9a-f]{32})$" {
    root /data/posts;
    disable_symlinks on;
    try_files /$1/index.html =404;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-cache, no-transform";
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Referrer-Policy "no-referrer" always;
}

location ~ "^/i/([0-9a-f]{32}\.(?:jpg|png|gif|webp|avif|mp4|webm))$" {
    alias /data/files/$1;
    disable_symlinks on;
    types {
        image/jpeg jpg;
        image/png  png;
        image/gif  gif;
        image/webp webp;
        image/avif avif;
        video/mp4  mp4;
        video/webm webm;
    }
    add_header Cache-Control "public, max-age=1209600";
    add_header Content-Security-Policy "sandbox" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex" always;
}

# Smaller copies from imgproxy, which reads the data folder itself. Clients pick only among these widths and formats.
location ~ "^/r/(640|960|1280|1920|2560)/(avif|webp)/([0-9a-f]{32}\.(?:jpg|png|gif|webp|avif))$" {
    set $preset w$1:$2;
    set $file $3;
    if (!-f /data/files/$file) { return 404; }
    rewrite ^ /unsafe/$preset/plain/local:///files/$file break;
    proxy_pass http://imgproxy:8080;
    proxy_connect_timeout 2s;
    proxy_intercept_errors on;
    error_page 400 415 422 429 500 502 503 504 = @original;
    proxy_hide_header Cache-Control;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Request-Id;
    add_header Cache-Control "public, max-age=31536000";
    add_header Content-Security-Policy "sandbox" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex" always;
}
location @original { return 302 /i/$file; }

location = /favicon.ico { return 204; }
location /a/ { return 404; }
location /i/ { return 404; }
location /r/ { return 404; }

location / {
    auth_basic "imagehost";
    auth_basic_user_file /etc/nginx/imagehost.htpasswd;
    proxy_set_header Authorization "";
    proxy_set_header Host $http_host;
    proxy_pass http://imagehost:8080;
}
